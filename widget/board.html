<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aio64 board</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: #1f1f1f;
        --muted: #6b6b6b;
        --button-bg: #f0ece4;
        --button-border: #c9c1b2;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #ececec;
          --muted: #a0a0a0;
          --button-bg: #2f2c28;
          --button-border: #555049;
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        color: var(--text);
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      main {
        width: min(100%, 360px);
        margin: 8px auto;
      }
      #board {
        width: 100%;
        aspect-ratio: 1;
      }
      #collapsed {
        color: var(--muted);
        text-align: center;
        padding: 4px 0;
      }
      /* Tree selector: the current tree's label, how many trees, close. */
      #tree-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 4px 0;
      }
      #tree-select {
        flex: 1;
        min-width: 0;
        padding: 4px 6px;
        border: 1px solid var(--button-border);
        border-radius: 6px;
        background: var(--button-bg);
        color: var(--text);
        font: inherit;
      }
      #tree-count {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #close-tree {
        padding: 4px 8px;
        border: 1px solid var(--button-border);
        border-radius: 6px;
        background: var(--button-bg);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      #close-tree:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
        margin-top: 6px;
      }
      #controls button {
        min-width: 40px;
        padding: 6px 10px;
        border: 1px solid var(--button-border);
        border-radius: 6px;
        background: var(--button-bg);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      #controls button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      /* Three engine lines; the height stays fixed so the tabs never jump. */
      #analysis {
        /* Above the board; its reserved height keeps the board still. */
        margin-bottom: 6px;
        min-height: calc(3 * 1.5em);
        line-height: 1.5;
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #analysis div {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #analysis .score {
        display: inline-block;
        min-width: 52px;
        color: var(--text);
        font-weight: 600;
      }
      /* Messages (errors, the tree cap) above the engine lines. */
      #analysis .notice {
        white-space: normal;
        color: var(--text);
      }
      #analysis .depth {
        float: right;
        margin-left: 8px;
        font-size: 11px;
      }
      #tabs {
        display: flex;
        gap: 4px;
        margin-top: 10px;
        border-bottom: 1px solid var(--button-border);
      }
      .tab {
        padding: 5px 12px;
        border: none;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
      .tab.active {
        color: var(--text);
        border-bottom-color: var(--text);
        font-weight: 600;
      }
      #moves,
      #explorer,
      #games {
        height: 200px;
        overflow-y: auto;
        padding-top: 8px;
      }
      #moves {
        line-height: 1.7;
      }
      #moves .move {
        padding: 1px 3px;
        border-radius: 3px;
        cursor: pointer;
      }
      #moves .move:hover {
        background: var(--button-bg);
      }
      #moves .move.current {
        background: var(--button-border);
        font-weight: 600;
      }
      #moves .variation {
        color: var(--muted);
      }
      .toggle {
        padding: 5px 10px;
        border: 1px solid var(--button-border);
        border-radius: 6px;
        background: transparent;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .toggle.active {
        background: var(--button-bg);
        font-weight: 600;
      }
      #explorer-source {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      #explorer-status,
      #games-status {
        margin: 6px 0 2px;
        color: var(--muted);
        font-size: 12px;
      }
      .rows {
        list-style: none;
        margin: 4px 0;
        padding: 0;
      }
      .rows li {
        display: flex;
        gap: 8px;
        padding: 3px 4px;
        border-radius: 4px;
        cursor: pointer;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
      }
      .rows li:hover {
        background: var(--button-bg);
      }
      .rows .main {
        min-width: 56px;
        font-weight: 600;
      }
      .rows .muted {
        color: var(--muted);
      }
      /* The color played: two circles drawn alike, white and black, rather
         than two font glyphs that render at different sizes. */
      .rows .side {
        flex: none;
        width: 10px;
        height: 10px;
        align-self: center;
        border-radius: 50%;
        border: 1px solid var(--muted);
        box-sizing: border-box;
      }
      .rows .side.white {
        background: #fff;
      }
      .rows .side.black {
        background: #000;
      }
      /* A move's game count, right-aligned with digits of equal width so
         that the counts line up. */
      .rows .count {
        min-width: 3em;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      /* A move's results: won (light), drawn (grey), lost (dark), each as
         wide as its share; the same in light and dark mode, like a board. */
      .rows .bar {
        flex: 1;
        display: flex;
        min-width: 0;
        height: 1.3em;
        align-self: center;
        overflow: hidden;
        border-radius: 3px;
        border: 1px solid var(--button-border);
        font-size: 0.8em;
        line-height: 1.3em;
      }
      .rows .bar > span {
        overflow: hidden;
        white-space: nowrap;
        text-align: center;
      }
      .rows .bar .won {
        background: #f2f2f2;
        color: #333;
      }
      .rows .bar .drawn {
        background: #8c8c8c;
        color: #fff;
      }
      .rows .bar .lost {
        background: #3a3a3a;
        color: #eee;
      }
      /* A game on two lines, games separated by a rule. */
      .rows li.game {
        flex-direction: column;
        gap: 1px;
        border-bottom: 1px solid var(--button-border);
      }
      .rows li.game > div {
        display: flex;
        gap: 8px;
      }
      .rows li.game > div + div {
        /* The second line starts under the name, past the color circle. */
        padding-left: 18px;
        font-size: 0.85em;
      }
      .rows li.game .result {
        font-weight: 600;
      }
      .rows .grow {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="analysis"></div>
      <div id="board"></div>
      <div id="tree-row">
        <select id="tree-select" aria-label="Tree"></select>
        <span id="tree-count"></span>
        <button id="close-tree" title="Close this tree" aria-label="Close this tree">&#x2715;</button>
      </div>
      <div id="controls">
        <button id="flip" title="Flip board" aria-label="Flip board">&#x21C5;</button>
        <button id="first" title="Beginning of game" aria-label="Beginning of game">&#x23EE;</button>
        <button id="back" title="Back" aria-label="Back">&#x25C0;</button>
        <button id="forward" title="Forward" aria-label="Forward">&#x25B6;</button>
        <button id="last" title="End of game" aria-label="End of game">&#x23ED;</button>
        <button id="mainline" title="Make the line through this move the main line">Raise</button>
        <button id="explain">Explain</button>
      </div>
      <div id="tabs">
        <button id="tab-moves" class="tab active">Moves</button>
        <button id="tab-explorer" class="tab">Explorer</button>
        <button id="tab-games" class="tab">Games</button>
      </div>
      <div id="explorer-source" hidden>
        <button id="source-book" class="toggle" title="Explorer: the local opening book">Local</button>
        <button id="as-side" class="toggle" title="Explorer: your games with the side at the bottom (flip to change)"></button>
      </div>
      <section id="moves"></section>
      <section id="explorer" hidden>
        <div id="explorer-status"></div>
        <ul id="book-moves" class="rows" hidden></ul>
        <ul id="explorer-moves" class="rows"></ul>
        <ul id="explorer-games" class="rows"></ul>
      </section>
      <section id="games" hidden>
        <div id="games-status"></div>
        <ul id="games-list" class="rows"></ul>
      </section>
      <div id="collapsed" hidden>Continued below &#x2193;</div>
    </main>
    <script type="module" src="./board.ts"></script>
  </body>
</html>
